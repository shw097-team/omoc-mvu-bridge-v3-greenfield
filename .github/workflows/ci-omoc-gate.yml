name: ci
on:
  pull_request:
  merge_group:
jobs:
  omoc_gate:
    name: omoc-gate
    runs-on: ubuntu-latest
    steps:
      - name: report
        run: echo ok

  terminator:
    name: terminator
    if: always()
    needs: [omoc_gate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Terminator (never skip)
        run: echo "Terminator: ensures 'ci / omoc-gate' is reported even if upstream fails"
