on:
  push:
    branches: [ main ]

jobs:
  omoc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run acceptance script
        run: |
          if [ -f ./scripts/accept/cp3_accept.sh ]; then
            chmod +x ./scripts/accept/cp3_accept.sh
            ./scripts/accept/cp3_accept.sh
          else
            echo "ERROR: ./scripts/accept/cp3_accept.sh not found"
            exit 2
          fi
