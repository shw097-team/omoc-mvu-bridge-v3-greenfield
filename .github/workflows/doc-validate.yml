name: doc-validate
on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  doc-validate:
    name: doc-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic files exist check
        run: |
          echo "doc-validate running"
          # Minimal existence check (non-fatal)
          test -f README.md || echo "README.md not found"
  shim-omoc-gate-extra:
    name: ci / omoc-gate (pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: Ensure acceptance scripts present
        run: |
          set -euo pipefail
          test -d scripts/accept || (echo "scripts/accept missing" && exit 1)
      - name: Run cp3 acceptance shim
        shell: bash
        run: |
          echo "Running cp3_accept.sh as shim"
          bash scripts/accept/cp3_accept.sh
