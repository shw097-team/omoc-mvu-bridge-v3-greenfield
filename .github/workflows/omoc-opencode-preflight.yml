name: omoc-opencode-preflight

on:
  pull_request:
  merge_group:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight (Mode A / No prompts)
        run: |
          bash scripts/omoc_opencode_preflight.sh

  always-report:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Report
        run: |
          echo "preflight result: ${{ needs.preflight.result }}"
          exit 0
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Report
        run: |
          echo "preflight result: ${{ needs.preflight.result }}"
          test "${{ needs.preflight.result }}" = "success"