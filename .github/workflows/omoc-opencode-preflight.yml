name: omoc-opencode-preflight

on:
  pull_request:
  merge_group:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: init OMOC_TS
        shell: bash
        run: echo "OMOC_TS=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Check dependencies (node only - opencode is optional)
        shell: bash
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "❌ ERROR: 'node' binary not found in PATH"
            exit 2
          fi
          echo "✅ node found: $(node --version)"
          echo ""
          echo "Note: 'opencode' CLI is not required in CI (offline mode will be used)"

      - name: Preflight (Mode A / No prompts)
        run: |
          bash scripts/omoc_opencode_preflight.sh

  always-report:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Report
        run: |
          echo "preflight result: ${{ needs.preflight.result }}"
          exit 0