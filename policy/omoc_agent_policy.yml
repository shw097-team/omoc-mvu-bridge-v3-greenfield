schema: omoc.agent_policy.v1  
version: v1.1.0

# PR-only (hard)  
pr_only: true

# Stop rules (bounded)  
limits:  
  max_iterations: 30  
  max_runtime_minutes: 45  
  max_retries: 2

# High-risk actions require manual acknowledgement  
high_risk_require_ack:  
  - secrets_write  
  - permissions_change  
  - network_egress  
  - rulesets_change  
  - branch_protection_change  
  - workflow_permission_escalation

audit_log:  
  path: evidence/_acceptance/${OMOC_TS}/audit/agent_audit.log  
  redact_secrets: true

# Tooling guardrails (skeleton)  
tool_policy:  
  allow:  
    - read_repo  
    - propose_patch  
    - open_pull_request  
    - run_tests  
    - run_linters  
  deny:  
    - push_default_branch  
    - print_tokens  
    - exfiltrate_data

# Required check name contract (canonical; exact string)  
required_check:  
  canonical_name: "ci / omoc-gate"

