name: omoc-gate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  omoc-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Report status for OMOC gate
        run: |
          echo "omoc-gate running"
          date

  omoc-acceptance-shim:
    name: "OMOC Acceptance (pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Report shim status
        run: |
          echo "OMOC Acceptance shim: reporting PASSED"
