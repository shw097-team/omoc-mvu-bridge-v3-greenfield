name: omoc-gate
on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  omoc-gate:
    name: omoc-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CP3 acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/accept/cp3_accept.sh
