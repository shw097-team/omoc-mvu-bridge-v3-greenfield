name: doc-validate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  doc_validate:
    name: doc-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate docs
        run: |
          echo "Checking documentation..."

  terminator:
    name: terminator
    if: always()
    needs: [doc_validate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Terminator (never skip)
        run: echo "Terminator: ensures doc-validate status is reported even if upstream fails"
